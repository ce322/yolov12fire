path: E:\Graduation_project\7.program\video-detect\video_detect_yolo\com\zhuanghd\
train: images\train
val: images\val

names:
  0: Fire
  1: Smoke
  
# 数据增强配置
augment:
  hsv_h: 0.015      # 色调调整范围
  fliplr: 0.5       # 水平翻转概率
  
# MEFAN多路径增强特征优化配置
mefan:
  enabled: true
  tfa_modules:
    - name: "P3_TFA"
      dynamic_conv: true
      carafe_upsample: true
    - name: "P4_TFA"
      dynamic_conv: true
      carafe_upsample: true
      
# 损失函数配置
loss:
  type: "adaptive_weighted"
  otsu_threshold: true
  weight_formula: "1 - (star / sbox)" 